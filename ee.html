<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to the LSU Course Planner</title>
<meta name="robots" content="noindex">
<style>
  html,body{height:100%;margin:0;}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#f3f2f7;color:#1c1a26;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .card{max-width:460px;}
  h1{font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif;font-weight:600;font-size:19px;margin:0 0 8px;}
  p{color:#55506a;font-size:14px;line-height:1.5;margin:0 0 16px;}
  a{display:inline-block;background:#461D7C;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:9px;}
</style>
<script>
// The EE / double-major tab is now part of the one planner. Every old link keeps working: the query string
// (?plan=… from this page) is passed through unchanged and index.html reads it.
(function () {
  try { window.location.replace('index.html' + (window.location.search || '') + (window.location.hash || '')); } catch (e) { /* the link below still works */ }
})();
</script>
</head>
<body>
  <div class="card">
    <h1>This page has moved</h1>
    <p>Electrical Engineering, Biological Engineering and double majors are all in the main course planner now. You should be redirected automatically, and your saved plan or shared link is carried over.</p>
    <p><a id="go" href="index.html">Open the planner →</a></p>
  </div>
  <script>
    (function () { try { document.getElementById('go').href = 'index.html' + (window.location.search || ''); } catch (e) { /* keep the plain link */ } })();
  </script>
</body>
</html>
